<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="animath-build" content="%VITE_BUILD_SHA%" />
		<title>Animath</title>
		<!-- A page, not a standalone web app, and kept out of search engines: DECISIONS § The page. -->
		<meta
			name="description"
			content="A cheerful math game for kids: explore, catch animals and win battles by solving sums. / Et muntert regnespil for børn: gå på opdagelse, fang dyr og vind kampe ved at regne."
		/>
		<meta name="theme-color" content="#8fd3f4" />
		<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Animath" />
		<meta property="og:title" content="Animath" />
		<meta
			property="og:description"
			content="A cheerful math game for kids: explore, catch animals and win battles by solving sums. / Et muntert regnespil for børn: gå på opdagelse, fang dyr og vind kampe ved at regne."
		/>
		<meta property="og:image" content="%VITE_SITE_ORIGIN%/social-preview.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="A squirrel, a rabbit and a frog in a sunny meadow, under the name Animath"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<noscript>
			<!-- Without JavaScript no copy file can be read: both languages, here. -->
			<div
				style="
					position: fixed;
					inset: 0;
					display: grid;
					place-items: center;
					padding: 16px;
					background: #8fd3f4;
					color: #2d2a32;
					font:
						600 20px/1.4 Nunito,
						system-ui,
						sans-serif;
					text-align: center;
				"
			>
				<div
					style="
						max-width: 520px;
						padding: 28px 32px;
						border-radius: 16px;
						background: #fffcf5;
						box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
					"
				>
					<img src="/favicon.svg" alt="" width="88" height="88" />
					<p lang="en">
						Animath needs JavaScript to play. Ask a grown-up to turn it on, then load the page
						again.
					</p>
					<p lang="da">
						Animath skal bruge JavaScript for at spille. Bed en voksen om at slå det til og hente
						siden igen.
					</p>
				</div>
			</div>
		</noscript>
		<canvas id="game"></canvas>
		<div id="ui"></div>
		<!--
			For a browser too old to read the game's scripts (Safari before 15, say),
			which never runs boot.ts: once the page's scripts have run, a page that
			boot.ts has not marked as started shows this card, and so does one whose
			game boot.ts could not read (`animath:too-old`). No copy file can be read
			there, so the card says it in both languages. Its script is ES5, so every
			browser reads it (browsers.ts checks that it stays so).
		-->
		<div
			id="too-old"
			style="
				display: none;
				position: fixed;
				top: 0;
				right: 0;
				bottom: 0;
				left: 0;
				align-items: center;
				justify-content: center;
				padding: 16px;
				background: #8fd3f4;
				color: #2d2a32;
				font:
					600 20px/1.4 Nunito,
					system-ui,
					sans-serif;
				text-align: center;
			"
		>
			<div
				style="
					max-width: 520px;
					padding: 28px 32px;
					border-radius: 16px;
					background: #fffcf5;
					box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
				"
			>
				<img src="/favicon.svg" alt="" width="88" height="88" />
				<p lang="en">
					<span data-device="ipad">This iPad</span><span data-device="iphone">This iPhone</span
					><span data-device="other">This browser</span> is a bit too old for Animath. Ask a
					grown-up to update it, or try another device.
				</p>
				<p lang="da">
					<span data-device="ipad">Denne iPad</span><span data-device="iphone">Denne iPhone</span
					><span data-device="other">Denne browser</span> er lidt for gammel til Animath. Bed en
					voksen om at opdatere den eller prøv en anden enhed.
				</p>
			</div>
		</div>
		<script>
			(function () {
				var shown = false;
				function tooOld() {
					var card = document.getElementById('too-old');
					if (shown || !card) return;
					shown = true;
					var ua = navigator.userAgent;
					var device =
						/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
							? 'ipad'
							: /iPhone|iPod/.test(ua)
								? 'iphone'
								: 'other';
					var names = card.querySelectorAll('[data-device]');
					for (var i = 0; i < names.length; i++) {
						if (names[i].getAttribute('data-device') !== device) names[i].style.display = 'none';
					}
					card.style.display = 'flex';
				}
				document.addEventListener('animath:too-old', tooOld);
				document.addEventListener('DOMContentLoaded', function () {
					if (!document.documentElement.hasAttribute('data-started')) tooOld();
				});
			})();
		</script>
		<script type="module" src="/src/boot.ts"></script>
	</body>
</html>
