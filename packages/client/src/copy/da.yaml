about:
  squirrel: 'Det har en busket rød hale. Det gemmer nødder, som det spiser om vinteren.'
  rabbit: 'Den har lange ører og en lille hvid hale. Den tramper i jorden for at advare de andre.'
  frog: 'Den har glat, våd hud og lange bagben. Den fanger fluer med sin klæbrige tunge.'
  fox: 'Den har rød pels og en busket hale med hvid spids. Den kan høre en mus under sneen.'
  otter: 'Den har tyk brun pels og svømmehud mellem tæerne. Den fanger fisk og elsker at lege.'
  deer: 'Den har rødbrun pels. Hannerne får et nyt gevir hvert år.'
  wolf: 'Den har grå pels og lever sammen med sin familie i en flok. Den hyler for at kalde på de andre.'
  bear: 'Den har tyk brun pels. Den sover vinteren væk i en lun hule.'
  shrew: 'Den har en lang, spids snude og bittesmå øjne. Den spiser insekter næsten hele tiden.'
  wood-mouse: 'Den har store øjne, store ører og en lang hale. Den kan hoppe højt på bagbenene.'
  brown-rat: 'Den har brun pels og en lang, nøgen hale. Den er meget klog og en god svømmer.'
  hedgehog: 'Det har skarpe pigge på ryggen. Det ruller sig sammen til en kugle, når det er bange.'
  mole: 'Den har blød sort pels og store gravepoter. Den graver lange gange under jorden.'
  common-lizard: 'Det har små brune skæl. Det lægger sig i solen for at få varmen.'
  common-toad: 'Den har vortet brun hud og gyldne øjne. Den kravler hellere, end den hopper.'
  robin: 'Den har et klart orangerødt bryst. Den synger også om vinteren.'
  stag-beetle: 'Den er mørk og blank. Hannerne har kæmpestore kæber, der ligner et gevir.'
  roe-deer: 'Det har en hvid plet på numsen. Når det bliver bange, gøer det ligesom en hund.'
  badger: 'Den har sorte og hvide striber i ansigtet. Den kommer frem om natten og spiser regnorme.'
  pine-marten: 'Den har brun pels og en gul plet på brystet. Den klatrer lynhurtigt i træerne.'
  stoat: 'Den har en lang, tynd krop og en sort spids på halen. Om vinteren bliver pelsen hvid.'
  adder: 'Den har en mørk zigzagstribe på ryggen. Den lugter med tungen.'
  grey-heron: 'Den har lange ben og et langt, spidst næb. Den står helt stille og venter på fisk.'
  tawny-owl: 'Den har bløde brune fjer. Den kan dreje hovedet næsten hele vejen rundt.'
  raccoon: 'Den har en sort maske og en stribet hale. Den føler på maden med poterne, før den spiser den.'
  beaver: 'Den har store orange tænder og en flad hale. Den fælder træer med tænderne og bygger dæmninger.'
  buzzard: 'Den har brune vinger og et krumt næb. Den svæver i store cirkler højt oppe.'
  wild-boar: 'Det har stride børster og en lang tryne. Ungerne har lyse striber på ryggen.'
  mute-swan: 'Den er helt hvid og har et orange næb. Den bærer ungerne på ryggen.'
  eagle-owl: 'Den har orange øjne og fjertoppe, der ligner ører. Den flyver helt lydløst.'
  lynx: 'Den har sorte duske på ørerne og en kort hale. Dens store, lodne poter virker som snesko.'
  wolverine: 'Den ligner en lille bjørn med en busket hale. Den kan lugte mad dybt nede i sneen.'
  golden-eagle: 'Den har gyldne fjer på hovedet og i nakken. Den kan se en hare langt, langt væk.'
  white-tailed-eagle: 'Den har en hvid hale og et stort gult næb. Den dykker ned og griber fisk med kløerne.'
  moose: 'Den har meget lange ben og en stor, blød mule. Den elsker at gumle på blade og kviste.'
  european-bison: 'Den har et stort, pjusket hoved og korte horn. Den vælter sig i støvet for at holde fluerne væk.'
  crab: 'Den har et hårdt skjold og to store klosakse. Den går sidelæns.'
  starfish: 'Den har fem arme. Mister den en arm, vokser der en ny ud.'
  turtle: 'Den har et hårdt skjold og store luffer. Den svømmer op til overfladen for at trække vejret.'
  dolphin: 'Den er glat og grå. Den klikker og fløjter for at snakke med sine venner.'
  octopus: 'Den har otte arme og ingen knogler. Den kan skifte farve for at gemme sig.'
  whale: 'Den har kæmpelange luffer. Den synger sange, der kan vare i timevis.'
  moon-jellyfish: 'Den er klar som glas og har fire ringe på toppen. Den har slet ingen hjerne.'
  plaice: 'Den er flad og har orange prikker. Begge dens øjne sidder på samme side af hovedet.'
  lions-mane-jellyfish: 'Den har lange tråde, der ligner en løves manke. De kan blive længere end en bus!'
  lobster: 'Den har et mørkeblåt skjold og to store klosakse. Den kan svømme lynhurtigt baglæns.'
  harbour-seal: 'Den har plettet pels og store mørke øjne. Den kan holde vejret meget længe.'
  harbour-porpoise: 'Det er rundt og gråt og har en kort snude. Det puster højt, når det kommer op for at trække vejret.'
  grey-seal: 'Den har et langt hoved, lidt ligesom en hest. Ungerne har blød, hvid pels.'
  orca: 'Den er sort og hvid og har en høj finne på ryggen. Den jager sammen med sin familie.'
  arctic-fox: 'Den har tyk, hvid pels om vinteren. Den sover med den lodne hale over snuden.'
  arctic-hare: 'Den har sorte spidser på ørerne. Den kan hoppe på bagbenene ligesom en kænguru!'
  puffin: 'Den har et flot, stribet orange næb. Den kan have mange små fisk i næbbet på én gang.'
  arctic-lemming: 'Den er lille, rund og blød. Om vinteren bliver den hvid og får store kløer at grave med.'
  snow-bunting: 'Det er en lille hvid fugl med sorte vinger. Den synger, mens den flyver.'
  rock-ptarmigan: 'Den er hvid om vinteren og brun om sommeren. Den har fjer på fødderne, så de holder sig varme.'
  waxwing: 'Den har en sjov fjertop på hovedet og en gul stribe på halen. Den elsker bær.'
  adelie-penguin: 'Den er sort og hvid og har en hvid ring om hvert øje. Den bygger sin rede af små sten.'
  snow-petrel: 'Den er helt hvid med sorte øjne og sort næb. Den spytter stinkende olie, hvis man kommer for tæt på.'
  arctic-tern: 'Den har en sort hætte og et rødt næb. Hvert år flyver den længere end noget andet dyr.'
  king-eider: 'Det er en and med en sjov orange bule på næbbet. Den dykker dybt efter mad.'
  raven: 'Det er en stor sort fugl, og den er meget klog. Den kan efterligne lyde, endda ord!'
  barnacle-goose: 'Den har et hvidt ansigt og en sort hals. Ungerne hopper ned fra høje klipper, når de er helt små.'
  gentoo-penguin: 'Den har et orange næb og en hvid stribe hen over hovedet. Ingen pingvin svømmer hurtigere.'
  chinstrap: 'Den har en tynd sort stribe under hagen, ligesom remmen på en hjelm. Den sover kun et par sekunder ad gangen, men det gør den tusindvis af gange om dagen.'
  reindeer: 'Både hannerne og hunnerne har gevir. Når det går, siger det klik i fødderne!'
  snowy-owl: 'Den er hvid med mørke pletter og har gule øjne. Den jager også om dagen.'
  great-grey-owl: 'Den har et kæmpestort, rundt ansigt med ringe i. Den kan høre en mus dybt nede under sneen.'
  glaucous-gull: 'Det er en stor, lys måge uden sort på vingerne. Den spiser næsten alt, hvad den finder.'
  giant-petrel: 'Det er en stor brun fugl med et kæmpestort, lyst næb. Den kan lugte mad langt væk.'
  king-penguin: 'Den har orange pletter på halsen. Ungerne er brune og lodne som små bamser.'
  arctic-wolf: 'Det er en hvid ulv med tyk pels. Den lever sammen med sin familie i en flok.'
  gyrfalcon: 'Det er den største falk af alle. Den kan være hvid, grå eller mørk, og den flyver meget hurtigt.'
  emperor-penguin: 'Det er den største pingvin, og den har gult på halsen. Det er far, der holder ægget varmt på fødderne!'
  albatross: 'Den har de længste vinger af alle fugle. Den kan svæve i timevis uden at baske med vingerne.'
  polar-bear: 'Den ser hvid ud, men huden under pelsen er sort! Den er en dygtig svømmer.'
  musk-ox: 'Den har lang, pjusket pels helt ned til fødderne. Når der er fare, stiller flokken sig i en ring om ungerne.'
  sea-angel: 'Det er en lille, gennemsigtig snegl uden hus. Den svømmer ved at baske med to små vinger.'
  polar-cod: 'Det er en lille sølvfarvet fisk med et stort hoved. Den fryser ikke, selv i iskoldt vand.'
  antarctic-krill: 'Den er lille og lyserød, lidt ligesom en reje. Den kan lyse i mørket!'
  arctic-char: 'Den har en knaldrød mave og små lyse pletter. Den kan blive over 20 år gammel.'
  lumpsucker: 'Den er rund og knudret og har en sugeskive på maven. Det er far, der passer på æggene.'
  ringed-seal: 'Den har lyse ringe i den grå pels. Det er en af de mindste sæler.'
  icefish: 'Den er bleg og næsten gennemsigtig. Den har en lang snude ligesom en krokodille.'
  harp-seal: 'Den har et mørkt mønster på ryggen. Ungerne er helt hvide og lodne.'
  wolffish: 'Den har store, stærke tænder, som den knuser krabber og muslinger med. Den ser barsk ud, men den er rolig.'
  snow-crab: 'Den har meget lange, tynde ben. Når skallen bliver for lille, skifter den til en ny og større.'
  weddell-seal: 'Den har et rundt ansigt, der ser ud, som om det smiler. Ungerne kan svømme, når de er to uger gamle.'
  beluga: 'Den er helt hvid og har en rund, blød pande. Den pipper og fløjter ligesom en fugl.'
  hooded-seal: 'Den har grå pels med mørke pletter. Hannerne kan puste en rød ballon ud af næsen!'
  minke-whale: 'Den har et spidst hoved og en hvid stribe på hver luffe. Den er nysgerrig og svømmer gerne helt hen til både.'
  toothfish: 'Det er en stor grå fisk med skarpe tænder. Den kan blive 50 år gammel!'
  crabeater-seal: 'Den har takkede tænder, der virker som en si. Den spiser krill, ikke krabber!'
  walrus: 'Den har to lange stødtænder og et stort, stift overskæg. Den bruger stødtænderne til at hive sig op på isen.'
  bowhead-whale: 'Den har et kæmpestort hoved og en hvid hage. Den kan blive 200 år gammel!'
  greenland-shark: 'Det er en langsom haj, der ser søvnig ud. Den kan blive flere hundrede år gammel!'
  narwhal: 'Den har et langt, snoet horn ligesom en enhjørning. Men hornet er faktisk en tand!'
  elephant-seal: 'Den har en blød, hængende næse, der ligner en lille elefantsnabel. Den kan holde vejret i over en time!'
  blue-whale: 'Den er blågrå med lyse pletter. Det er det største dyr, der nogensinde har levet!'
  leopard-seal: 'Den har pletter ligesom en leopard og et stort, bredt gab. Den synger lange sange under vandet.'
