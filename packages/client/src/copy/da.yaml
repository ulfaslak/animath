# Dansk. Every key in en.yaml exists here, reading the same {params};
# test/copy-files.test.ts checks.
# How to add a line: AGENTS/DNA/DEVELOPMENT.md § Copy and languages.
# How it should sound: AGENTS/DNA/DESIGN.md § Voice and copy (Danish).

language:
  # This language's own name, as the Language setting lists it.
  name: Dansk

puzzle:
  # Under a puzzle until it is answered.
  keys: Skriv svaret, og tryk så på Enter

battle:
  # On the Leash row: how likely a throw is to catch the wild animal right now.
  leashGood: God chance!
  leashMaybe: Måske
  leashHard: Svært at fange
  # An attack's three levels: the highlighted row's buttons, and every other row's word.
  level:
    easy: let
    medium: mellem
    hard: svær
  # The key reminder under "Pick an attack".
  menuKeys: ↑ ↓ vælg · ← → hvor svært · Enter kør
  # The highlighted attack. {attack}: its name; {level}: its level's word;
  # {kinds}: what its sums are about (the words below, in an "or" list); {damage}: how much it hits for.
  attackDetail: '{attack} på {level}: {kinds}. Det gør {damage} skade.'
  # What each kind of puzzle is about, as {kinds} lists them.
  kinds:
    add: plus
    sub: minus
    mul: gangetabeller
    div: deling
    missing: manglende tal
    sequence: talmønstre
    sqrt: kvadratrødder
  # Narration: your animal steps in, at the start or after a switch.
  go: 'Kom så, {name}!'
  switch:
    # The Switch row of the action menu, and what it says when highlighted.
    row: Skift
    detail: Send et andet dyr ind. Det bruger din tur.
    alone: Du skal have to dyr for at skifte. Fang et med snoren!
    allTired: Dine andre dyr er trætte.
    # The party list: its title, its keys (no way back after a knock-out), its tags.
    title: Vælg et dyr
    keys: ↑ ↓ vælg · Enter kør · Esc tilbage
    mustPickKeys: ↑ ↓ vælg · Enter kør
    tiredTag: træt
    inBattleTag: på banen
    # The highlighted animal of the list; {name} is its name.
    sendIn: 'Send {name} ind. Så får det vilde dyr en tur.'
    sendInFree: 'Send {name} ind. Så er det din tur.'
    tired: '{name} er træt og skal hvile sig.'
    inBattle: '{name} er allerede på banen.'
    # Narration: the animal in front is tired and someone must go in.
    whoIsNext: '{name} er træt. Hvem skal ind nu?'
    # Narration: the animal in front goes back to make room.
    comeBack: 'Kom tilbage, {name}!'

explore:
  # Under the latest message for a player's first few moves.
  controls: Brug piletasterne eller WASD for at gå
  # Under the latest message while the player faces a doctor's tent.
  talkPrompt: Tryk på Enter for at tale med dyrlægen
  # Enter anywhere but facing a tent.
  notAtTent: Gå hen til et telt for at tale med dyrlægen.

party:
  # The tag on an animal at 0 HP.
  tired: træt
  # The message line, when a number key or "Sæt forrest" made {name} the lead,
  # or a change in the pause menu left {name} in front.
  leadChosen: '{name} er først ud!'
  # The message line, when the number of a tired animal was pressed.
  leadTired: '{name} er træt. Besøg dyrlægen!'
  # The message line, when the lead's own number was pressed.
  leadAlready: '{name} er allerede først ud!'

doctor:
  # The name tag in front of what the doctor says.
  title: Dyrlæge
  # Opening the card with someone to help.
  hello: Hej! Hvem skal jeg hjælpe i dag?
  # Opening the card with nobody to help.
  helloAllFit: Hej! Alle dine dyr er friske og glade.
  # A puzzle for {name}, just picked.
  letsHelp: Lad os hjælpe {name}! Kan du løse den her?
  # After a wrong answer; a new puzzle follows.
  notQuite: Ikke helt! Lad os prøve en anden.
  # After a right answer, while someone else still needs the doctor.
  healedNext: Godt klaret! {name} har det godt igen! Hvem er den næste?
  # After a right answer that leaves everyone at full HP.
  healedAll: Godt klaret! {name} har det godt igen! Alle er friske og glade!
  # On the message line after leaving the card.
  goodbye: Hej hej! Kom bare igen, når du vil.
  # After a lost battle, woken beside a tent.
  rescuedAtTent: Dyrlægen har passet godt på dine dyr. Nu har alle det godt igen!
  # After a lost battle with no tent near: a doctor came to the player.
  rescuedHere: En dyrlæge kom forbi og passede godt på dine dyr. Nu har alle det godt igen!
  # The last row of the list, and its key.
  bye: Farvel
  byeKey: Esc
  # The puzzle area before an animal is picked.
  pick: Vælg et dyr
  pickDetail: Løs en opgave, så får {name} det godt igen!
  byeDetail: Sig farvel, og gå på opdagelse.
  listKeys: ↑ ↓ flyt · Enter vælg · Esc farvel
  # Under a doctor's puzzle while another animal needs help too.
  puzzleKeys: ↑ ↓ hjælp et andet dyr · Esc farvel
  # The puzzle area when nobody needs the doctor.
  allFit: Ud på eventyr!
  allFitKeys: Enter eller Esc for at sige farvel

keys:
  # A key cap, as printed on the keyboard.
  esc: Esc
  enter: Enter

hud:
  # The tag on the card of the lead: the animal that steps into the next battle.
  goesFirst: først ud
  # Under the party cards, after the number keys 1–n.
  pickLead: Vælg hvem der er først ud
  # Under the party cards, after the Esc key cap.
  menu: Menu

pause:
  # The pause menu's title.
  title: Pause
  # Above the list of the party's animals.
  team: Dit hold
  # The row that closes the menu.
  resume: Spil videre
  # The picked animal's options: become the lead, move one place, get a nickname.
  goFirst: Sæt forrest
  moveUp: Flyt op
  moveDown: Flyt ned
  newName: Nyt navn
  back: Tilbage
  # The right-hand panel before an animal is picked.
  pick: Vælg et dyr
  pickHelp: Vælg hvem der er først ud, flyt det, eller giv det et navn.
  # Under the options of a tired animal, whose "Sæt forrest" is greyed.
  tiredHelp: '{name} er træt og kan ikke være først ud.'
  # Above the name box.
  nameTitle: Nyt navn til {name}
  # Under the name box; {max} is the most characters a name can have.
  nameRule: Bogstaver og tal, højst {max}.
  # Under the name box, when the typed name will be stored differently.
  willBe: Navnet bliver {name}.
  # The key reminder at the bottom, one per screen of the menu.
  keysList: ↑ ↓ flyt · Enter vælg · Esc luk
  keysOptions: ↑ ↓ flyt · Enter gør det · Esc tilbage
  keysNaming: Enter gem · Esc tilbage

save:
  # On the message line when a saved game is picked up.
  welcomeBack: Velkommen tilbage!
  # The saved game could not be read. It is kept aside; this is a new game.
  couldNotLoad: Dit gemte spil virkede ikke, så her er et nyt.
  # The saved game was written by a newer version of the game than this page.
  newerGame: Dit spil er gemt af en nyere Animath. Genindlæs siden for at spille det!
  # The browser will not let the page store anything, so nothing is saved.
  cannotSave: Denne browser kan ikke gemme dit spil, så det starter forfra hver gang.
  # After a window that another window of the game had played past loads the newest game.
  caughtUp: Du spillede i et andet vindue. Her er dit nyeste spil!
  # On a window that another window of the game has played past, until it catches up.
  behind: Du spillede videre i et andet vindue.
  # The button on that card.
  behindGo: Hent dit nyeste spil
