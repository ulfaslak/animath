# Dansk. Every key in en.yaml exists here, reading the same {params};
# test/copy-files.test.ts checks.
# How to add a line: AGENTS/DNA/DEVELOPMENT.md § Copy and languages.
# How it should sound, and the glossary: AGENTS/DNA/DESIGN.md § Voice and copy, Danish.
#
# {animal.form} picks one of a species' forms below. Your own animal is
# called by name in a label or a call ("Kom så, Ræv!") and with "the" in a
# sentence ("Ræven er træt."); a wild one is "den vilde …" or "en vild …".
# A nickname stands for every form, spelled as the kid wrote it. A form that
# starts a sentence gets a capital letter by itself.

language:
  name: Dansk

app:
  loading: Vent lidt…
  updating:
    title: Tilbage om lidt!
    body: Spillet gør sig klar.
  noWebGL:
    title: Denne browser kan ikke tegne Animaths verden.
    ask: Bed en voksen om hjælp!
    grownUps: 'Til voksne: Animath skal bruge WebGL 2. Tjek at hardwareacceleration er slået til i browserens indstillinger eller prøv en anden browser. På en iPad eller iPhone slår Låsetilstand det fra.'
  moved:
    title: Animath er flyttet!
    go: Spil på {domain}
    stay: Spil videre her

keys:
  esc: Esc
  enter: Enter
  challenge: C

