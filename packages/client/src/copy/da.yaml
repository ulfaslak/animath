save:
  # On the message line when a saved game is picked up.
  welcomeBack: Velkommen tilbage!
  # The saved game could not be read. It is kept aside; this is a new game.
  couldNotLoad: Dit gemte spil virkede ikke, så her er et nyt.
  # The browser will not let the page store anything, so nothing is saved.
  cannotSave: Denne browser kan ikke gemme dit spil, så det starter forfra hver gang.
  # On the title, after writing the save failed (the browser's storage is full).
  storageFull: Denne browser har ikke mere plads til at gemme dit spil.
  # After a window that another window of the game had played past loads the newest game.
  caughtUp: Du spillede i et andet vindue. Her er dit nyeste spil!
  # The server says the account is logged out: on the title, or on the message line mid-game.
  sessionEnded: Du er logget ud, så dit spil gemmes kun på denne enhed. Log ind for at passe på det.
  # On a window that another window of the game has played past, until it catches up.
  behind: Du spillede videre i et andet vindue.
  # The same card when the newest game came from somewhere else (an account's copy on
  # the server, or a new game started in another window), shown only when the page has already reloaded by itself three times in a minute.
  behindReady: Dit spil blev gemt et andet sted.
  # The same card when the saved game was cleared (a new game comes next), shown only
  # when the page has already reloaded by itself three times in a minute.
  behindGone: Lad os starte et nyt spil!
  # The button on that card.
  behindGo: Lad os spille!
  # The same card when a newer version of the game saved the game (in another tab, or
  # on the server) and this page is still the old version: it takes no play, and a
  # reload fetches the new one. Shown when the page may not reload by itself.
  behindNewer: En ny udgave af spillet er klar.
  # The button on that card, with the Enter key beside it.
  behindUpdate: Opdater!
  # The same button on a touch screen.
  behindUpdateTouch: Tryk for at opdatere!

