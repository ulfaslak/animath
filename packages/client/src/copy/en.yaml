# English: the fallback language. Every key here exists in every language
# file, reading the same {params}; test/copy-files.test.ts checks.
# How to add a line: AGENTS/DNA/DEVELOPMENT.md § Copy and languages.
# How it should sound: AGENTS/DNA/DESIGN.md § Voice and copy.
#
# {animal.form} picks one of a species' forms below (name, a, the, wild, aWild,
# theWild); a nickname stands for every form, spelled as the kid wrote it. A
# form that starts a sentence gets a capital letter by itself.

language:
  # This language's own name, as the Language setting lists it.
  name: English

app:
  # While the world is being built.
  loading: Loading…
  # The page the game's address shows for the few seconds a new version of
  # the game takes to start, or while the server is down. It reloads itself
  # every 5 seconds, and is the game again as soon as the game answers. The
  # page is nginx/502.html and holds a copy of these lines, in every language;
  # test/updating-page.test.ts checks the copy.
  updating:
    title: Back in a moment!
    body: The game is getting ready.
  # Instead of the game, when the browser cannot draw its world (no WebGL 2).
  # The last line is for the grown-up who can fix it.
  noWebGL:
    title: This browser can't draw Animath's world.
    ask: Ask a grown-up for help!
    grownUps: "For grown-ups: Animath needs WebGL 2. Check that hardware acceleration is on in the browser's settings, or try another browser. On an iPad or iPhone, Lockdown Mode turns it off."
  # Instead of the game, on an old address of it (the one it was shared from before it
  # had its own): the game lives at {domain} now (animath.xyz). The big button goes
  # there; the small link under it, for a grown-up, plays on at the old address.
  moved:
    title: Animath has moved!
    go: Play at {domain}
    stay: Keep playing here

keys:
  # Key caps, as printed on the keyboard.
  esc: Esc
  enter: Enter
  # The key that challenges the player beside you (match.button).
  challenge: C

