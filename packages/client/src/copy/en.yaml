puzzle:
  # Under a puzzle until it is answered.
  keys: Type the answer, then press Enter
  # The same, with the touch controls on: the number pad beside the puzzle.
  keysTouch: Tap the answer, then OK
  # The number pad's keys that have words: the one that answers, and what a
  # screen reader calls the minus and the delete key.
  ok: OK
  minus: Minus
  delete: Delete
  # After an answer, on the puzzle card and in the battle's narration.
  correct: Correct!
  notQuite: Not quite!
  # Under a clock's puzzle, whose answer is a time: hours, a colon, minutes.
  keysTime: Type the time, hours then minutes, then press Enter
  keysTimeTouch: Tap the time, hours then minutes, then OK
  # What a screen reader calls the number pad's colon key, on a clock's puzzle.
  colon: Colon
  # The question of a puzzle with a picture (the Arctic's kinds). Numbers are
  # filled in from the puzzle; {fraction} is a fraction drawn stacked, and
  # {who} and {other} are the shapes under a bar chart's bars, drawn in the line.
  ask:
    thermometer:
      colder: It is {start}°. It gets {change}° colder. What does the thermometer show now?
      warmer: It is {start}°. It gets {change}° warmer. What does the thermometer show now?
      rose: In the morning it is {start}°. At noon it is {end}°. How many degrees warmer did it get?
      fell: At noon it is {start}°. At night it is {end}°. How many degrees colder did it get?
    kroner:
      count: How many kroner is this?
      oneThing: You buy a toy for {price} kroner. You pay with the money in the picture. How much do you get back?
      twoThings: You buy a book for {price} kroner and a hat for {other} kroner. You pay with the money in the picture. How much do you get back?
    fraction: What is {fraction} of {amount}?
    shape:
      floor: How many floor tiles are there?
      fence: How many fence pieces go all the way around?
      floorSide: The floor has {total} tiles. How many tiles long is the side with the question mark?
      fenceSide: The fence has {total} pieces all the way around. How many pieces long is the side with the question mark?
    barchart:
      read: How many fish did {who} catch?
      more: How many more fish did {who} catch than {other}?
      both: How many fish did {who} and {other} catch together?
      all: How many fish did they catch in all?
    clock:
      read: What time is it?
      later: What time will it be in {time}?
      earlier: What time was it {time} ago?
      # How long passes, in the questions above: "1 hour and 20 minutes".
      hours:
        one: '{count} hour'
        other: '{count} hours'
      minutes:
        one: '{count} minute'
        other: '{count} minutes'
      both: '{hours} and {minutes}'
  # The picture's own words: the kroner sign on a coin or a note, and a missing side's mark.
  picture:
    kr: kr
    missing: '?'
    # A bar chart's marks, as a screen reader names them in the question.
    marks:
      circle: the circle
      triangle: the triangle
      square: the square
      star: the star
      heart: the heart

explore:
  # Under the latest message for a player's first few moves.
  controls: Arrows / WASD to walk
  # The same, with the touch controls on: the arrow pad in the corner.
  controlsTouch: Hold an arrow to walk
  # Under the latest message while the player faces the witch doctor's tent.
  talkPrompt: Press Enter to talk to the witch doctor
  # The same, with the touch controls on; "Talk" is explore.talk.
  talkPromptTouch: Tap Talk to talk to the witch doctor
  # The touch controls' round button: talk to the witch doctor, as Enter does.
  talk: Talk
  # Under the latest message while the player faces a tree and owns the axe.
  chopPrompt: Press Enter to chop the tree
  # The same, with the touch controls on; "Chop" is explore.chop.
  chopPromptTouch: Tap Chop to chop the tree
  # Under the latest message while the player faces a rock and owns the pickaxe.
  breakPrompt: Press Enter to break the rock
  # The same, with the touch controls on; "Break" is explore.break.
  breakPromptTouch: Tap Break to break the rock
  # The touch controls' round button (explore.talk) while it chops a tree.
  chop: Chop
  # The same button while it breaks a rock.
  break: Break
  # Under the latest message while the player faces an ice block and owns the ice pick.
  breakIcePrompt: Press Enter to break the ice block
  # The same, with the touch controls on; "Break" is explore.break.
  breakIcePromptTouch: Tap Break to break the ice block
  # Under the latest message while the player faces a fishing hole and owns the fishing rod.
  fishPrompt: Press Enter to fish
  # The same, with the touch controls on; "Fish" is explore.fish.
  fishPromptTouch: Tap Fish to fish
  # The touch controls' round button (explore.talk) while it fishes at a hole.
  fish: Fish
  # A cast at a fishing hole, and nothing bit.
  caughtNothing: Nothing bit this time. Try again!
  # A cast at a fishing hole with nobody in the team who can swim: nothing bites then.
  noSwimmer: Nothing bites, because no animal in your team can swim. Bring a swimmer!
  # The first bump into a tree without the axe, and Enter facing one.
  needAxe: You need an axe to chop trees. The witch doctor sells one!
  # The first bump into a rock without the pickaxe, and Enter facing one.
  needPickaxe: You need a pickaxe to break rocks. The witch doctor sells one!
  # The first bump into an ice block without the ice pick, and Enter facing one.
  # Leaving the witch doctor's card just after buying the skis: how to ski.
  skiHow: Hold an arrow to go faster and faster on the snow. Let go and you glide on!
  needIcePick: You need an ice pick to break ice blocks. The witch doctor sells one!
  # Enter facing a fishing hole without the fishing rod.
  needRod: You need a fishing rod to fish here. The witch doctor sells one!
  # What a screen reader calls the arrow pad's four arrows.
  walkUp: Walk up
  walkDown: Walk down
  walkLeft: Walk left
  walkRight: Walk right
  # Over the whole screen when a touch screen is held upright.
  turnSideways: Turn your screen sideways to play!
  # Enter with nothing in front to talk to, chop or break.
  notAtTent: Walk up to a tent to talk to the witch doctor.
  # Under the latest message for as long as no animal can fight (after a lost
  # battle), until the witch doctor has helped one: nothing jumps out of the grass meanwhile.
  tired: Your animals are tired. Walk to the witch doctor's tent!
  # The same, out on the water in the boat.
  tiredSail: Your animals are tired. Sail to the witch doctor's tent!
  # The same, walled in where no tent is a walk away, with the paraglider (no witch doctor
  # comes to a kid who can fly): glide out, and walk from there.
  tiredFly: Your animals are tired. Fly out to find the witch doctor's tent!
  # What a screen reader calls the arrow at the screen's edge that points to the nearest tent then.
  doctorArrow: The way to the witch doctor's tent
  # With the glider: a tap of Space with nothing in front, and the witch doctor's goodbye
  # just after buying it. "Space" is the space bar.
  holdToFly: Hold Space to fly!
  # The same, with the touch controls on; "Fly" is explore.fly.
  holdToFlyTouch: Hold Fly to fly!
  # The witch doctor's goodbye just after buying the harness: a big animal (a deer, a bear…)
  # at the top of the team carries the kid.
  rideBig: Put a big animal first and hop on!
  # A take-off with no ground to land on in the 20 tiles ahead (a lake too wide, a forest too deep).
  tooFar: Too far! There's nowhere to land that way.
  # Up in the air, a wild bird noticed the glider and follows it down; its battle
  # starts on landing. {bird.aGrumpy}: the bird's own form, "a grumpy Buzzard".
  birdFollows: '{bird.aGrumpy} is following you!'
  # The touch controls' round button that flies with the glider, held down.
  fly: Fly

hud:
  # The tag on the card of the lead: the animal that steps into the next battle.
  goesFirst: goes first
  # Under the party cards, after the number keys 1–n.
  pickLead: Pick who goes first
  # The same, with the touch controls on: the cards themselves are tapped.
  pickLeadTouch: Tap an animal to pick who goes first
  # With the touch controls on, when a card holds several animals of one kind.
  openTouch: Tap a card to open it, then tap who goes first
  # Under the party cards, with two or more: how to put them in another order.
  dragMouse: Drag a card to move it
  dragTouch: Hold a card, then drag it
  # Under the party cards, after the Esc key cap; and the touch controls' menu button.
  menu: Menu
  # The player's tokens, at the top right.
  tokens:
    one: '{count} {money.word}'
    other: '{count} {money.words}'
  # The puzzles the player has solved, under the tokens: every right answer adds one.
  solved:
    one: '{count} puzzle'
    other: '{count} puzzles'
  # Where the player stands, at the bottom right: steps to the right (x) and up
  # the screen (y) from where their world begins, which is x 0 · y 0. Below
  # zero the other way, with a real minus sign ("x −3 · y 12").
  coordinates: 'x {x} · y {y}'

# A card of the party: every animal of one kind, stacked (the HUD, the pause
# menu, the battle's switch list).
team:
  # Beside the kind's name on a card of several animals.
  count: '×{count}'
  # Under the name on a card of several animals: how they are. Ready: more
  # than a fifth of their HP left. Tired soon: still playing, but a fifth or
  # less (their HP bar is red). Tired: none left. All of them one of those,
  # or each count that isn't zero, with " · " between.
  allReady: All ready
  allTiredSoon: All tired soon
  allTired: All tired
  ready:
    one: '{count} ready'
    other: '{count} ready'
  tiredSoon:
    one: '{count} tired soon'
    other: '{count} tired soon'
  tired:
    one: '{count} tired'
    other: '{count} tired'

party:
  # The tag on an animal at 0 HP.
  tired: tired
  # The message line, when a number key or "Go first" made {animal} the lead,
  # or a change in the pause menu left {animal} in front.
  leadChosen: '{animal.name} goes first!'
  # The message line, out on the water, when the number of an animal that can't swim was pressed.
  leadCantSwim: "{animal.name} can't swim! On the water, an animal that swims goes first."
  # The message line, on land, when the number of a sea animal was pressed.
  leadInTheSea: '{animal.name} lives in the sea! On land, an animal that walks goes first.'
  # The message line, when the number of a tired animal was pressed.
  leadTired: '{animal.name} is tired. Visit the witch doctor!'
  # The message line, when the lead's own number was pressed.
  leadAlready: '{animal.name} already goes first!'
  # The message line, when the number of a card whose animals are all tired was pressed.
  leadAllTired: They are all tired. Visit the witch doctor!

battle:
  # The status box over the wild animal.
  wildName: '{animal.wild}'
  # Narration, one line per beat. {animal} is yours, unless it says wild.
  appears: '{animal.aWild} appears!'
  # The same, up in the air: the bird that followed the glider down.
  appearsAir: '{animal.aWild} swoops down!'
  go: 'Go, {animal.name}!'
  whatNow: 'What will {animal.name} do?'
  tries: '{animal.name} tries {attack}!'
  used: '{animal.name} used {attack}!'
  # A hit: {target} is the animal hit (the wild one here, yours below); {damage}
  # is the HP it loses, said the same way as in battle.attackDetail.
  usedDamage: '{animal.name} used {attack}! It hits {target.theWild} for {damage}.'
  # Your wrong answer: the wild animal shrugs it off.
  youMissed: 'Missed! {animal.theWild} shrugs it off.'
  wildUsed: '{animal.wild} used {attack}!'
  wildUsedDamage: '{animal.wild} used {attack}! It hits {target.name} for {damage}.'
  wildMissed: '{animal.wild} used {attack}! It missed.'
  tired: '{animal.name} is tired.'
  wildTired: '{animal.wild} is tired!'
  gotAway: You got away!
  # The preview card while the action menu is up, before anything is picked:
  # the title of the highlighted move (an attack's title is its name), and the
  # key reminder for it. On an attack left and right change its level; on the
  # row of moves they go along the row.
  menu:
    leash: Throw the leash
    switch: Switch animals
    run: Run away
    keys: ↑ ↓ ← → choose · Enter go
    keysAttack: ↑ ↓ choose · ← → how hard · Enter go
    # A greyed move (Switch with nobody to send in), where Enter does nothing.
    keysGreyed: ↑ ↓ ← → choose
    # The same, with the touch controls on. "Go!" is battle.goButton.
    touch: Tap Go!
    touchAttack: Tap an attack, then Go!
  # The button that does the highlighted row (an attack, the leash, a switch),
  # and the one that leaves the party list, as Enter and Esc do.
  goButton: Go!
  backButton: Back
  # The highlighted attack. {attack}: its name; {level}: its level's word;
  # {kinds}: what its sums are about (the words below, in an "or" list);
  # {animal}: the wild animal it would hit; {damage}: the HP it would lose.
  attackDetail: '{attack} on {level}: {kinds}. It hits {animal.theWild} for {damage}.'
  # On the preview card, when the highlighted attack at its level would bring
  # the wild animal to 0 HP.
  tiresOut: That would tire it out!
  # What a puzzle looks like to the kid, as {kinds} lists the ones an attack's
  # puzzles can be at its level (the engine's puzzleTopics). `missing` is a
  # number missing from a sum ("7 + ? = 12"); one missing from a times table
  # ("7 × ? = 56") is listed as `mul`.
  kinds:
    add: adding
    sub: taking away
    mul: times tables
    div: sharing
    missing: missing numbers
    sequence: number patterns
    sqrt: square roots
    thermometer: temperatures
    kroner: money
    fraction: fractions
    area: floor tiles
    perimeter: fences
    barchart: bar charts
    balance: balancing
    clock: telling the time
  # An attack's three levels: the level picker's buttons, and the word on each attack's tile.
  level:
    easy: easy
    medium: medium
    hard: hard
  leash:
    row: Leash
    # What the row says when highlighted. {animal}: the wild animal.
    detail: 'Try to catch {animal.theWild}! It works best when its HP is low.'
    # Beside the row: how likely a throw is to catch the wild animal right now.
    good: Good chance!
    maybe: Maybe
    hard: Hard to catch
    # Narration of a throw.
    throw: You throw the leash…
    caught: Caught!
    brokeFree: It broke free!
  run:
    row: Run
    # What the row says when highlighted. {animal}: the wild animal.
    detail: 'You always get away. {animal.theWild} stays in the grass.'
    # The same, out on the water.
    detailSea: 'You always get away. {animal.theWild} stays in the water.'
    # The same, up in the air.
    detailAir: 'You always get away. {animal.theWild} stays up in the sky.'
  switch:
    # The Switch row of the action menu, and what it says when highlighted.
    row: Switch
    detail: Send in a different animal. It uses up your turn.
    alone: You need a second animal to switch. Catch one with the leash!
    allTired: Your other animals are tired.
    # Out on the water, when every other animal standing can't swim.
    noSwimmers: Your other animals can't swim.
    # On land, when every other animal standing is a sea animal.
    noWalkers: Your other animals live in the sea.
    # Up in the air, when every other animal standing can't fly.
    noFlyers: Your other animals can't fly.
    # The party list: its title, its keys (no way back after a knock-out), its tags.
    title: Pick an animal
    keys: ↑ ↓ choose · Enter go · Esc back
    mustPickKeys: ↑ ↓ choose · Enter go
    # Both lists, with the touch controls on.
    touch: Tap an animal, then Go!
    tiredTag: tired
    inBattleTag: in battle
    # Out on the water, on an animal that can't swim: it sits the battle out in the boat.
    cantSwimTag: can't swim
    # On land, on a sea animal: it only fights out on the water.
    seaTag: lives in the sea
    # Up in the air, on an animal that can't fly: it sits the battle out on the ground.
    cantFlyTag: can't fly
    # The highlighted animal of the list.
    sendIn: 'Send in {animal.name}. Then the wild animal gets a turn.'
    sendInFree: "Send in {animal.name}. Then it's your turn."
    tired: '{animal.name} is tired and needs a rest.'
    inBattle: '{animal.name} is already in the battle.'
    cantSwim: "{animal.name} can't swim. It stays in the boat."
    inTheSea: '{animal.name} lives in the sea. It only fights out on the water.'
    cantFly: "{animal.name} can't fly. It only fights on the ground."
    # Narration: the animal in front is tired and someone must go in.
    whoIsNext: '{animal.name} is tired. Who goes next?'
    # Narration: the animal in front goes back to make room.
    comeBack: 'Come back, {animal.name}!'
  # The card at the end, and its button.
  result:
    won: You won!
    caught: 'You caught {animal.a}!'
    lost: Good try!
    fled: You got away!
    button: Keep exploring
  # The authority's closing line under the result card, then on the message
  # line. These keys are the engine's LINES; {animal} is the wild animal.
  closing:
    won: '{animal.theWild} runs home to rest.'
    fled: '{animal.theWild} stays in the grass.'
    # The same, out on the water.
    wonSea: '{animal.theWild} swims home to rest.'
    fledSea: '{animal.theWild} stays in the water.'
    # The same, up in the air.
    wonAir: '{animal.theWild} flies home to rest.'
    fledAir: '{animal.theWild} stays up in the sky.'
    joined: '{animal.name} joins your team!'
    # Under "Good try!": the team is tired where it stood, and walks to a doctor.
    lost: Your animals need a rest. The witch doctor will make them feel all better!

# The witch doctor at every tent: he heals, takes animals to set free, and
# sells tools. "Witch doctor" everywhere, never "doctor" alone.
doctor:
  # The name tag in front of what the witch doctor says.
  title: Witch doctor
  # The team needs the witch doctor and no tent is near (after a lost battle, a go-to or a
  # trip): one came and helped everyone right there. Under "Good try!" and on the message line.
  came: A witch doctor came by and looked after your animals. Everyone feels better!
  # Opening the card with someone to help.
  hello: Hello! Who needs help today?
  # Opening the card with nobody to help.
  helloAllFit: Hello! Your animals are all fit and happy.
  # A puzzle for {animal}, just picked.
  letsHelp: Let's help {animal.name}! Can you solve this?
  # The same, when {others} more of its kind are hurt too: one puzzle helps them all.
  letsHelpMore: Let's help {animal.name} and {others} more! Can you solve this?
  # After a wrong answer; a new puzzle follows.
  notQuite: Not quite! Let's try another one.
  # After a wrong answer to a token sum: the same sum stays.
  tryAgain: Not quite! Try again.
  # After a right answer, while someone else still needs the witch doctor.
  healedNext: Well done! {animal.name} feels all better! Who is next?
  # After a right answer that leaves everyone at full HP.
  healedAll: Well done! {animal.name} feels all better! Everyone is fit and happy!
  # The same two, when {others} more of its kind were healed with it.
  healedMoreNext: Well done! {animal.name} and {others} more feel all better! Who is next?
  healedMoreAll: Well done! {animal.name} and {others} more feel all better! Everyone is fit and happy!
  # On the message line after leaving the card.
  goodbye: Bye! Come back any time.
  # The last row of the list, and its key.
  bye: Bye
  byeKey: Esc
  # The button that puts a puzzle away, back to the list, and its key.
  back: Back
  # The card's tabs: heal the hurt animals, set animals free to go home to the wild, the shop.
  tabs:
    heal: Heal
    home: Set free
    shop: Shop
  # The player's tokens, at the top right of the card.
  tokens:
    one: '{count} {money.word}'
    other: '{count} {money.words}'
  # The heal tab's right-hand side before an animal is picked.
  pick: Pick an animal
  pickDetail: Solve a puzzle and {animal.name} feels all better!
  # The same, when {others} more of its kind are hurt too.
  pickDetailMore: Solve one puzzle and {animal.name} and {others} more feel all better!
  byeDetail: Say bye and go exploring.
  listKeys: ↑ ↓ choose · ← → tabs · Enter pick · Esc bye
  # The same, with the touch controls on.
  listTouch: Tap an animal to help it
  # Under a witch doctor's puzzle while another animal needs help too.
  puzzleKeys: ↑ ↓ help another animal
  puzzleTouch: Tap another animal to help it instead
  # The heal tab when nobody needs the witch doctor.
  allFit: Time to explore!
  allFitKeys: ← → tabs · Enter or Esc to say bye
  allFitTouch: Tap Bye to go exploring

  # The set-free tab: the animals picked are made all better and go home to the wild,
  # and the witch doctor thanks the kid with tokens.
  home:
    # The witch doctor's line on the tab: why wild animals attack.
    intro: Wild animals are a little bit sick. That's why they are so grumpy!
    title: Set animals free
    how: Pick animals to set free. I make them all better, and they go home to the wild. You get {money.words} as a thank-you!
    # The highlighted animal, and what it brings.
    worth:
      one: '{animal.name} brings {count} {money.word}.'
      other: '{animal.name} brings {count} {money.words}.'
    # The highlighted animal, when it has to stay: picking it too would leave no animal that can walk with the kid.
    stays: '{animal.name} stays with you.'
    # The highlighted row of a kind ("Fox ×40"), which picks them all: how many, and what they all bring.
    kindWorth: All {count} bring {amount} {money.words}.
    # The same, when one of the kind has to stay: how many of them can go, and what they bring.
    kindWorthSome:
      one: '1 of them brings {amount} {money.words}.'
      other: '{count} of them bring {amount} {money.words}.'
    # How many animals are picked, and what they bring together: the running total.
    picked:
      one: '1 animal picked: {amount} {money.words}.'
      other: '{count} animals picked: {amount} {money.words}.'
    # When one animal has to stay: the last one left that isn't tired and walks on land
    # (a sea animal can't), the one that walks on with the kid.
    keepOne: Keep one animal that can walk with you!
    # When no animal at all can walk on with the kid (only tired ones, or sea animals, standing):
    # nobody can go home until one is healed.
    noWalker: No animal can walk with you now. Heal one first!
    # The button under the animals.
    send: Set them free
    keys: ↑ ↓ choose · ← → tabs · Enter pick · Esc bye
    touch: Tap the animals to set free
    # The confirm before a hand-over: the witch doctor's line, the question, and the choices.
    sure: Are you sure? They will be happy in the wild!
    sureTitle: Say bye bye to {names.name}?
    sureTitleMany: Say bye bye to {many} animals?
    sureDetail: They go home to the wild, all better. You get {amount} {money.words}.
    keep: No, not now
    yes: Yes, bye bye!
    sureKeys: ← → choose · Enter pick · Esc back
    # The token sum for a hand-over: the witch doctor's line, then the story round the sum.
    count: Thank you! Can you count your {money.words}?
    story:
      one: You have {count} {money.word}. You get {amount} more. How many will you have?
      other: You have {count} {money.words}. You get {amount} more. How many will you have?
    # After the right answer: the animals leave, then the tokens come.
    wentHomeOne: Bye bye, {animal.name}! It feels much better now.
    wentHomeFew: Bye bye, {names.name}! They feel much better now.
    wentHomeMany: Bye bye, all {many}! They feel much better now.
    tokensGiven:
      one: Thank you! Here are {amount} {money.words}. Now you have {count} {money.word}.
      other: Thank you! Here are {amount} {money.words}. Now you have {count} {money.words}.

  # The shop tab: tools bought with tokens.
  shop:
    intro: Look what I have! You pay with {money.words}.
    # The witch doctor's line while nothing is for sale.
    introEmpty: My shop opens soon!
    emptyTitle: Nothing for sale yet
    emptyDetail: New things are coming soon. Keep your {money.words}!
    # The tab's right-hand side while Bye is lit, over what Bye does (doctor.byeDetail).
    pick: Pick something to buy
    # The same once the kid has every thing on sale.
    allOwned: You have everything!
    # An item's price.
    price:
      one: '{count} {money.word}'
      other: '{count} {money.words}'
    # Why an item can't be bought: it is owned, or {count} tokens are missing.
    owned: You have {item.the}!
    short:
      one: You need {count} more {money.word}.
      other: You need {count} more {money.words}.
    keys: ↑ ↓ choose · ← → tabs · Enter buy · Esc bye
    touch: Tap a thing to buy it
    # The token sum for a purchase: the witch doctor's line, then the story round the sum.
    count: Good choice! Can you count your {money.words}?
    story:
      one: You have {count} {money.word}. {item.the} costs {price}. How many will you have left?
      other: You have {count} {money.words}. {item.the} costs {price}. How many will you have left?
    # After the right answer.
    bought:
      one: Here is {item.your}! You have {count} {money.word} left.
      other: Here is {item.your}! You have {count} {money.words} left.

# What the witch doctor's shop sells: as a label, with "the" and "your", and what it does.
items:
  axe:
    name: Axe
    the: the axe
    your: your axe
    use: Chops down trees.
  pickaxe:
    name: Pickaxe
    the: the pickaxe
    your: your pickaxe
    use: Breaks rocks.
  boat:
    name: Boat
    the: the boat
    your: your boat
    use: Sails on water.
  glider:
    name: Paraglider
    the: the paraglider
    your: your paraglider
    use: Glides over trees, rocks and water.
  harness:
    name: Harness
    the: the harness
    your: your harness
    use: Ride on big animals.
  arctic-axe:
    name: Arctic axe
    the: the arctic axe
    your: your arctic axe
    use: Chops down spruces.
  ice-pick:
    name: Ice pick
    the: the ice pick
    your: your ice pick
    use: Breaks ice blocks.
  fishing-rod:
    name: Fishing rod
    the: the fishing rod
    your: your fishing rod
    use: Fishes at holes in the ice.
  # A pair: "the pair of skis costs 34", "here is your pair of skis".
  skis:
    name: Skis
    the: the pair of skis
    your: your pair of skis
    use: Hold an arrow and go faster and faster on the snow!

# What a land pays in, said in a sentence: one of it, and more. Nordland's tokens, and
# The Arctic's ice dollars (Danish "iskroner").
currency:
  tokens:
    word: token
    words: tokens
  iceDollars:
    word: ice dollar
    words: ice dollars

pause:
  # The pause menu's title.
  title: Paused
  # Above the list of the party's animals.
  team: Your team
  # The row that closes the menu.
  resume: Keep playing
  # The row that leaves the game for the title screen (the game is saved; Continue picks it up).
  quit: Start screen
  # The account's rows: a guest's two, and a logged-in player's one.
  makeAccount: Make an account
  logIn: Log in
  logOut: Log out
  # The row that switches every word to another language; each language is
  # listed by its own name (language.name above).
  language: Language
  # The Sound setting's row: its name, then the word beside its switch.
  sound: Sound
  soundOn: 'On'
  soundOff: 'Off'
  # The right-hand panel while the Sound row is highlighted: with a keyboard, then on a touch screen.
  soundHelp: Enter or ← → turns the sound on and off. You can also press M.
  soundHelpTouch: Tap Sound to turn it on and off.
  # The picked animal's options: become the lead, move one place, get a nickname.
  goFirst: Go first
  moveUp: Move up
  moveDown: Move down
  newName: New name
  back: Back
  # The right-hand panel before an animal is picked.
  pick: Pick an animal
  pickHelp: Choose who goes first, move it, or give it a name.
  # Under the options of a tired animal, whose "Go first" is greyed.
  tiredHelp: "{animal.name} is tired, so it can't go first."
  # Under the options, out on the water, of an animal that can't swim, whose "Go first" is greyed.
  cantSwimHelp: "{animal.name} can't swim, so it can only go first on land."
  # Under the options, on land, of a sea animal, whose "Go first" is greyed.
  inTheSeaHelp: '{animal.name} lives in the sea, so it can only go first on the water.'
  # Under the options of the animal that goes first already, whose "Go first" is greyed.
  leadHelp: '{animal.name} already goes first.'
  # A card of several animals, under its options: its animals are listed below.
  pickOne: Pick one of them to move it or give it a name.
  # The same, when they are all tired and the card's "Go first" is greyed.
  allTiredHelp: "They are all tired, so they can't go first."
  # The same, out on the water, when they can't swim and the card's "Go first" is greyed.
  allCantSwimHelp: "They can't swim, so they can only go first on land."
  # The same, on land, when they live in the sea and the card's "Go first" is greyed.
  allInTheSeaHelp: They live in the sea, so they can only go first on the water.
  # Above the name box.
  nameTitle: New name for {animal.name}
  # Under the name box; {max} is the most characters a name can have.
  nameRule: Letters and numbers, up to {max}.
  # Under the name box, when the typed name will be stored differently.
  willBe: It will be called {name}.
  # The row that lists the other players in this world, and the panel it opens.
  players: Who's here
  # A player in that list: going to them puts you next to them.
  goTo: Go to {name}
  # How far away they are, under their name: exactly, for a few steps; roughly, further.
  stepsAway:
    one: '{count} step away'
    other: '{count} steps away'
  aboutStepsAway: 'about {count} steps away'
  rightHere: right here
  # Under the list.
  playersHelp: Pick someone to go to them.
  # Instead of the list: nobody else here, or the others can't be seen right now, and why.
  nobody: Nobody else is in this world right now.
  looking: Looking for other players…
  elsewhere: "You're playing in another window."
  unseen: Other players can't see this game.
  newVersion: A new version of the game is ready. It comes in a moment!
  # The key reminder at the bottom, one per screen of the menu.
  keysPlayers: ↑ ↓ choose · Enter go · Esc back
  keysList: ↑ ↓ choose · Enter pick · Esc close
  keysLanguage: ↑ ↓ choose · ← → or Enter change the language · Esc close
  keysSound: ↑ ↓ choose · ← → or Enter sound off or on · Esc close
  keysOptions: ↑ ↓ choose · Enter pick · Esc back
  keysNaming: Enter save · Esc back
  # The name box's buttons, as Enter and Esc do.
  save: Save

save:
  # On the message line when a saved game is picked up.
  welcomeBack: Welcome back!
  # The saved game could not be read. It is kept aside; this is a new game.
  couldNotLoad: Your saved game didn't load, so here is a new one.
  # The browser will not let the page store anything, so nothing is saved.
  cannotSave: This browser can't keep your game, so it starts new every time.
  # On the title, after writing the save failed (the browser's storage is full).
  storageFull: This browser has no room left to keep your game.
  # After a window that another window of the game had played past loads the newest game.
  caughtUp: You were playing in another window. Here's your newest game!
  # The server says the account is logged out (a new password, a year away): on the title,
  # or on the message line mid-game.
  sessionEnded: You're logged out, so your game only saves on this device. Log in to keep it safe.
  # On a window that another window of the game has played past, until it catches up.
  behind: You kept playing in another window.
  # The same card when the newest game came from somewhere else (an account's copy on
  # the server, or a new game started in another window), shown only when the page has already reloaded by itself three times in a minute.
  behindReady: Your game was saved in another place.
  # The same card when the saved game was cleared (a new game comes next), shown only
  # when the page has already reloaded by itself three times in a minute.
  behindGone: Let's start a new game!
  # The button on that card.
  behindGo: Let's play!
  # The same card when a newer version of the game saved the game (in another tab, or
  # on the server) and this page is still the old version: it takes no play, and a
  # reload fetches the new one. Shown when the page may not reload by itself.
  behindNewer: A new version of the game is ready.
  # The button on that card, with the Enter key beside it.
  behindUpdate: Update!
  # The same button on a touch screen.
  behindUpdateTouch: Tap to update!

account:
  # The account card's two boxes, and the button beside the password that shows it as typed.
  name: Your name
  password: Secret password
  show: Show
  hide: Hide
  back: Back
  # While the card asks the server.
  busy: Just a moment…
  # Under the boxes when making an account. {min}: the fewest characters a password has.
  passwordRule: 'At least {min} letters or numbers.'
  # On the title of a logged-in player. {name}: the account's name.
  playingAs: 'Playing as {name}'
  register:
    title: Keep your game safe
    text: Your name is what you log in with. Pick a secret password that only you know.
    go: Save my game
    keys: Tab other box · Enter save · Esc back
  login:
    title: Log in
    text: Type your name and your secret password.
    go: Log in
    # Under the boxes when logging in: a grown-up can set a new password.
    forgot: Forgot your password? Ask a grown-up to help.
    keys: Tab other box · Enter log in · Esc back
  # Why the card did not go on, in place of the line under the boxes.
  problem:
    taken: That name is taken. Pick another one!
    passwordShort: 'Your password needs at least {min} letters or numbers.'
    passwordLong: "That's a long password! {max} letters at most."
    wrong: That name and password don't go together. Try again!
    # Too many tries: the server asks to wait. {count}: minutes.
    tooMany:
      one: Lots of tries! Take a little break and try again in a minute.
      other: 'Lots of tries! Take a little break and try again in {count} minutes.'
    offline: We can't reach the game's home right now. Try again soon!
    # The account was made with the game, but this browser can't store anything, so it can't log in here.
    storage: "This browser can't remember you. Your game is saved in your account: log in on another tablet or computer."
  # The card after every 1,000 steps of a guest's game.
  prompt:
    title: Keep your animals safe!
    text: Pick a secret password, and your game is saved for good. You can play it on another tablet or computer too!
    save: Save my game
    later: Not now
    keys: ← → choose · Enter pick · Esc not now
  # On the message line after the page starts again for the account. {name}: the account's name.
  notice:
    saved: 'Your game is saved! Log in as {name} on any tablet or computer.'
    welcome: 'Welcome back, {name}!'
    movedAhead: You played on somewhere else. Here's your newest game!
  # The card a welcome link opens over the title: a grown-up brought the kid's game over from
  # another computer into an account, and the kid picks its password here.
  welcome:
    # While the page asks the server about the link, and when the server can't be reached.
    checking: Welcome back!
    # The account the link opens. {name}: its name.
    title: 'Welcome back, {name}!'
    text: Your animals are waiting. Pick a secret password.
    go: "Let's play!"
    later: Not now
    keys: Enter play · Esc not now
    # A link that works no more: its heading, then what to do instead.
    used: This link has been used already
    usedText: Log in with your name and your secret password.
    expired: This link is too old now
    expiredText: Ask a grown-up for a new one.
    unknown: This link doesn't work
    unknownText: Ask a grown-up for a new one.
    # The ways on from such a link: log in, or play the game this browser has.
    logIn: Log in
    guest: Play as a guest
    # For a browser logged in to an account already. {name}: that account's name.
    playAs: 'Play as {name}'
    goneKeys: Enter log in · Esc play
    # The same while the server can't keep an account, so the card offers no login.
    playKeys: Esc play
    # The server can't be reached: ask it again.
    retry: Try again
    retryKeys: Enter try again · Esc not now
    # This browser can't store anything, so the account couldn't be played here.
    storage: "This browser can't remember you. Open the link on another tablet or computer."

sound:
  # The chip at the top of the screen after M turned the sound on or off.
  chipOn: Sound is on
  chipOff: Sound is off
  # Under "Sound is off": how to get it back.
  chipHint: Press M to turn it back on

title:
  # The game's name, big, at the top of the title screen.
  name: Animath
  # The menu's rows.
  continue: Continue
  newGame: New game
  # The title's row for a player with an account made before: opens the login card.
  haveAccount: I have an account → Log in
  # The title just after logging out: over the rows, the account's game is safe; the first row
  # logs in to it again.
  loggedOut:
    title: Your animals are safe!
    text: You're logged out. Your game waits in your account.
    # The row, with the account's name beside it (and in the login card it opens).
    logIn: Log in
  # On the title of the game opened from the Home Screen with nothing saved there: a web app
  # keeps its own storage, apart from the browser's (#90).
  standaloneHint: Played in Safari before? Make an account there (Menu → Make an account), then log in here.
  language: Language
  sound: Sound
  # Beside Continue, after the name of the saved team's first animal: how big the team is.
  animals:
    one: '{count} animal'
    other: '{count} animals'
  # The key reminder under the menu; on a setting's row, how to change it.
  keys: ↑ ↓ choose · Enter pick
  keysSetting: ↑ ↓ choose · ← → change
  # Asked before a new game puts the saved one away. {animal}: the saved team's first animal.
  confirm:
    title: Start a new game?
    away: Your game with {animal.the} is put away safely.
    # Instead of `away`, on a page that keeps nothing (no storage, or a write that failed).
    notKept: Your game with {animal.the} can't be kept on this page.
    fresh: You start again with a new animal.
    back: No, go back
    yes: Yes, new game
    keys: ↑ ↓ choose · Enter pick · Esc back
  # The name box for the player's own name: a new game's first question, and Continue's
  # once for a game saved before players had names.
  player:
    title: What's your name?
    # Above the box on Continue, for a game saved before players had names.
    waiting: Your animals are waiting for you!
    keys: Enter done · Esc back
    # The card's button that goes on, as Enter does: to the starters of a new game.
    next: Next
    # The same button on Continue: into the saved game.
    go: "Let's go!"
  # The starters side by side.
  starter:
    title: Pick your first animal!
    # Under the lit one. {animal}: its species; {kinds}: every kind of sum its attacks ask, as a list.
    loves: '{animal.the} loves {kinds}!'
    keys: ← → choose · Enter pick · Esc back
    # The card's button that picks the lit one, as Enter does. {animal}: its species.
    pick: 'Pick {animal.the}!'
  # The name box for the animal just picked. {animal}: its species.
  naming:
    title: What will you call your {animal.name}?
    empty: "Leave it empty and it's just called {animal.name}."
    keys: Enter done · Esc back
    # The card's button that starts the game, as Enter does.
    start: "Let's go!"
  # The card's button that goes back a screen, as Escape does.
  back: Back

# A player's own name: what other players see above their character.
playerName:
  # Under a name box: what a name may be. {min}, {max}: how many letters at least and at most.
  rule: '{min} to {max} letters or numbers.'
  # Why a name did not go, under the box. Kind: the kid just tries again.
  refused:
    empty: Type your name first.
    short: A name needs at least {min} letters.
    long: "That's a long one! {max} letters at most."
    chars: Only letters and numbers, please.
    rude: "Let's pick another name."

# Other players in your world. {name} is a player's own name, shown as they wrote it.
presence:
  # On the message line after "Go to {name}": you are next to them now,
  nextTo: "You're next to {name}!"
  # they left this world before you got there,
  lost: "{name} isn't here any more."
  # the game can't reach the other players just now,
  cantFind: "Can't find {name} right now. Try again soon!"
  # or there is nowhere to stand near them (out at sea, and you have no boat).
  noRoom: "There's no room next to {name} right now."
  # The little note at the top of the screen when someone comes into your world:
  # one name, two, or one and how many more.
  arrived: '{name} is here!'
  arrivedTwo: '{name} and {other} are here!'
  arrivedMany: '{name} and {count} more are here!'
  # The same when someone leaves it.
  left: '{name} went home'
  leftTwo: '{name} and {other} went home'
  leftMany: '{name} and {count} more went home'
  # Under the names beside an arrow at the edge of the screen, when more than four
  # players are out of sight that way: the first three are named, and this many more.
  arrowMore: '+{count} more'
  # This window stopped showing you to the others: you went on in another window.
  elsewhere: "You're playing in another window."
  # What a player is busy with: the bubble over them, and beside their name in the list.
  busy:
    battle: battling a wild animal
    doctor: at the witch doctor
    menu: taking a break
    match: in a friendly match
    # Up in the air with the paraglider (no bubble: the glider shows it; only the list says it).
    flight: flying
  # The thought bubble over a player in a battle, said for screen readers: the
  # sum they are working out ({sum}, as the bubble shows it: "7 × 8 = ?"), or,
  # while they choose what to do, that they are thinking.
  thinking: '{name} is working out {sum}'
  choosing: '{name} is thinking…'
match:
  # A friendly match between two players. {name} is the other player, as they
  # typed it; {whose} is their name as the owner of what follows ("Bo's"),
  # made from match.whose (or match.whoseAfterS, for a name ending in s, x or
  # z: Danish writes "Jonas'").
  whose: "{name}'s"
  whoseAfterS: "{name}'s"
  # Over the world, when someone stands within two steps: the button, and under
  # it, greyed, why it can't be pressed now.
  button:
    challenge: 'Challenge {name}'
    busy: '{name} is busy right now.'
    theyWater: '{name} is out on the water.'
    water: "You're out on the water. Matches are on land."
    noTeam: You need an animal that can fight on land.
    wait: 'Ask {name} again in a moment.'
  # The card over the world: someone asks you, you ask someone, and the match coming.
  invite:
    title: '{name} wants a friendly match!'
    'yes': Yes!
    'no': No, thanks
    asking: 'Asking {name}…'
    neverMind: Never mind
    starting: Here we go!
  # On the message line, when an invite ends without a match (about the other
  # player), or a match does.
  said:
    'no': '{name} said no this time.'
    expired: "{name} didn't answer."
    withdrawn: '{name} changed their mind.'
    gone: '{name} had to go.'
    moved: '{name} walked away.'
    busy: '{name} is busy right now.'
    taken: '{name} is busy with someone else. Try again soon!'
    wait: 'Ask {name} again in a moment.'
    no-team: You need an animal that can fight on land.
    their-team: '{name} has no animal that can fight on land.'
    lost: "Can't reach {name} right now. Try again soon!"
    updating: The game is updating. Try again in a moment!
    youLeft: You left the match.
    # A rematch the other player had gone back to exploring before, on a page with no result to go back to.
    went: '{name} went back to exploring.'
  # Narration. Your own animal is {animal}; the other player's is "{whose}
  # {animal.bare}".
  vs: 'A friendly match with {name}!'
  youStart: You start!
  theyStart: '{name} starts!'
  backIn: 'Back in the match with {name}!'
  thinking: '{name} is thinking…'
  picking: '{name} is picking who goes next…'
  theyTry: '{whose} {animal.bare} tries {attack}!'
  theyRight: '{name} got it!'
  theyWrong: '{name} missed that one.'
  theirUsed: '{whose} {animal.bare} used {attack}!'
  usedDamage: '{animal.name} used {attack}! It hits {whose} {target.bare} for {damage}.'
  theirUsedDamage: '{whose} {animal.bare} used {attack}! It hits {target.name} for {damage}.'
  youMissed: 'Missed! {whose} {animal.bare} shrugs it off.'
  theirMissed: '{whose} {animal.bare} used {attack}! It missed.'
  theirTired: '{whose} {animal.bare} is tired!'
  theirGo: '{name} sends in {animal.name}!'
  theirComeBack: '{name} calls {animal.name} back.'
  # A status box in a match: each player's animal with its owner's name, the
  # other's and your own, so both names are on the screen.
  animalOf: '{whose} {animal.bare}'
  # The card while the other player takes their turn: their turn, and that they think.
  theirTurn: '{whose} turn'
  # The highlighted attack, as battle.attackDetail, hitting the other player's animal.
  attackDetail: '{attack} on {level}: {kinds}. It hits {whose} {animal.bare} for {damage}.'
  tiresOut: That would tire it out!
  switch:
    alone: You brought one animal to this match.
    sendIn: "Send in {animal.name}. Then it's {whose} turn."
  # The Leave move: its button, its card's title, and what it does.
  leave:
    row: Leave
    title: Leave the match
    detail: '{name} wins, and you go back to exploring.'
    # Escape in a match asks first: the question, its two buttons (Stay is lit
    # first), and its keys. Its line is match.leave.detail.
    ask: Leave the match?
    stay: Stay
    go: Leave
    keys: ← → choose · Enter go · Esc stay
  # The end of a match: warm for both.
  result:
    won: You won!
    wonText: 'Great match, {name}!'
    lost: '{name} won this time!'
    lostText: Good match! Want to play again?
    theyLeft: '{name} left the match.'
    hadToGo: '{name} had to go.'
    wanderedOff: '{name} wandered off.'
    # You sat on your turn too long.
    idle: '{name} wins this one.'
    idleText: You were away from the match for a while.
    # This page came back to a match that was over.
    missed: The match is over.
    missedText: It ended while you were away.
  rematch:
    button: Rematch?
    waiting: 'Waiting for {name}…'
    theyWant: '{name} wants a rematch!'
    went: '{name} went back to exploring.'
  back: Back to exploring
  resultKeys: ← → choose · Enter go
  # The server stopped for a new version in the middle of a match.
  updating:
    title: The game is updating.
    text: "Let's play again in a moment!"
    waiting: 'Waiting for {name} to come back…'
    asked: '{name} wants to play again!'
    again: Play again
    # It stopped without a word (the page found a new run of it on coming
    # back): nobody left the match. The rest of the card is as above.
    restarted: The game restarted.
    restartedText: Want to play again?
  # Notes at the top of the match.
  notes:
    offline: Getting the match back…
    away: '{name} dropped out. Waiting for them… {seconds}'
    stillThere: Still there?
    here: "I'm here!"
# Numbered worlds: the pause menu's Worlds screen, the HUD's corner, and the trip.
worlds:
  # A world by its number, as a label: the HUD's corner, the Worlds row. {world}: 1 to 9999.
  world: 'World {world}'
  # The pause menu's row that opens the Worlds screen, and the screen's title.
  title: Worlds
  here: 'You are in World {world}.'
  home: 'Your home is World {home}.'
  atHome: This is your home world.
  # Over the number being typed.
  typed: "A world's number"
  # The rows: go to the world typed, go home.
  go: 'Go to World {world}!'
  goNowhere: Go
  goHome: Go home
  # Why Go is greyed, under the rows.
  typeOne: "Type a world's number."
  notAWorld: Worlds go from 1 to 9999.
  alreadyHere: "You're in World {world} already!"
  tip: Every number is a world of its own.
  # The number pad's big key, as Enter.
  ok: Go
  keys: 0–9 type · ↑ ↓ choose · Enter pick · Esc back
  # On arrival, big: the world's number; under it, how the kid arrived.
  arrive: 'World {world}!'
  arriveNew: A new world to explore!
  arriveBack: Back where you left off.
  arriveHome: Home again!
# The lands (#191), by id: their names where a kid picks one, as the animal book's tabs do.
lands:
  nordland:
    name: Nordland
  arctic:
    name: The Arctic
book:
  # The animal book: a card for every kind of animal there is, a "?" for the ones not met yet.
  # The pause menu's row that opens it (on the menu's title line), and the book's own title.
  title: Animal book
  # Beside the row: how many kinds the kid has caught, of every kind there is.
  row: '{caught}/{all}'
  # Beside the book's title, and beside the row while it is lit: kinds caught, kinds seen
  # (met in a battle or a friendly match, caught or not), and every kind there is.
  count: '{caught} caught · {seen} seen · {all} in all'
  # Beside the count, after a rose heart: how many kinds the kid has set free at the witch
  # doctor's, of every kind there is.
  freed: '{freed} / {all} set free'
  # The panel beside the row while it is lit.
  help: Every animal you meet goes in your book. Can you catch them all?
  # Under the book, about the lit card: one not met yet (it gives nothing away), one met but
  # not caught, one caught and on the team, one on the team that has its heart (set free at
  # the witch doctor's, or counted so: a game from before the book kept the kinds set free
  # counts every kind it met and does not have as set free), one caught and set free since
  # (it stays caught for good), and one met, never caught, that counts as set free.
  unseen: Who could this be? Go exploring and find out!
  seen: You met {animal.a}. Catch one with your leash!
  caughtTeam: '{animal.name} is on your team!'
  freedTeam: '{animal.name} is on your team, and it counts as set free!'
  caughtHome: You caught {animal.a} and set it free. It stays in your book!
  seenFree: You met {animal.a}, and it counts as set free!
  # The key reminder under the book.
  # Under the book while the cursor is on the lands' tabs over the cards.
  lands: Pick a land to see its animals!
  keys: ↑ ↓ ← → choose · Esc back
