# English: the fallback language. Every key here exists in every language
# file, reading the same {params}; test/copy-files.test.ts checks.
# How to add a line: AGENTS/DNA/DEVELOPMENT.md § Copy and languages.
# How it should sound: AGENTS/DNA/DESIGN.md § Voice and copy.

language:
  # This language's own name, as the Language setting lists it.
  name: English

puzzle:
  # Under a puzzle until it is answered.
  keys: Type the answer, then press Enter

battle:
  # On the Leash row: how likely a throw is to catch the wild animal right now.
  leashGood: Good chance!
  leashMaybe: Maybe
  leashHard: Hard to catch
  # An attack's three levels: the highlighted row's buttons, and every other row's word.
  level:
    easy: easy
    medium: medium
    hard: hard
  # The key reminder under "Pick an attack".
  menuKeys: ↑ ↓ choose · ← → how hard · Enter go
  # The highlighted attack. {attack}: its name; {level}: its level's word;
  # {kinds}: what its sums are about (the words below, in an "or" list); {damage}: how much it hits for.
  attackDetail: '{attack} on {level}: {kinds}. It hits for {damage}.'
  # What each kind of puzzle is about, as {kinds} lists them.
  kinds:
    add: adding
    sub: taking away
    mul: times tables
    div: sharing
    missing: missing numbers
    sequence: number patterns
    sqrt: square roots
  # Narration: your animal steps in, at the start or after a switch.
  go: 'Go, {name}!'
  switch:
    # The Switch row of the action menu, and what it says when highlighted.
    row: Switch
    detail: Send in a different animal. It uses up your turn.
    alone: You need a second animal to switch. Catch one with the leash!
    allTired: Your other animals are tired.
    # The party list: its title, its keys (no way back after a knock-out), its tags.
    title: Pick an animal
    keys: ↑ ↓ choose · Enter go · Esc back
    mustPickKeys: ↑ ↓ choose · Enter go
    tiredTag: tired
    inBattleTag: in battle
    # The highlighted animal of the list; {name} is its name.
    sendIn: 'Send in {name}. Then the wild animal gets a turn.'
    sendInFree: "Send in {name}. Then it's your turn."
    tired: '{name} is tired and needs a rest.'
    inBattle: '{name} is already in the battle.'
    # Narration: the animal in front is tired and someone must go in.
    whoIsNext: '{name} is tired. Who goes next?'
    # Narration: the animal in front goes back to make room.
    comeBack: 'Come back, {name}!'

explore:
  # Under the latest message for a player's first few moves.
  controls: Arrows / WASD to walk
  # Under the latest message while the player faces a doctor's tent.
  talkPrompt: Press Enter to talk to the doctor
  # Enter anywhere but facing a tent.
  notAtTent: Walk up to a tent to talk to the doctor.

party:
  # The tag on an animal at 0 HP.
  tired: tired
  # The message line, when a number key or "Go first" made {name} the lead,
  # or a change in the pause menu left {name} in front.
  leadChosen: '{name} goes first!'
  # The message line, when the number of a tired animal was pressed.
  leadTired: '{name} is tired. Visit the doctor!'
  # The message line, when the lead's own number was pressed.
  leadAlready: '{name} already goes first!'

doctor:
  # The name tag in front of what the doctor says.
  title: Doctor
  # Opening the card with someone to help.
  hello: Hello! Who needs help today?
  # Opening the card with nobody to help.
  helloAllFit: Hello! Your animals are all fit and happy.
  # A puzzle for {name}, just picked.
  letsHelp: Let's help {name}! Can you solve this?
  # After a wrong answer; a new puzzle follows.
  notQuite: Not quite! Let's try another one.
  # After a right answer, while someone else still needs the doctor.
  healedNext: Well done! {name} feels all better! Who is next?
  # After a right answer that leaves everyone at full HP.
  healedAll: Well done! {name} feels all better! Everyone is fit and happy!
  # On the message line after leaving the card.
  goodbye: Bye! Come back any time.
  # After a lost battle, woken beside a tent.
  rescuedAtTent: The doctor looked after your animals. Everyone feels better!
  # After a lost battle with no tent near: a doctor came to the player.
  rescuedHere: A doctor came by and looked after your animals. Everyone feels better!
  # The last row of the list, and its key.
  bye: Bye
  byeKey: Esc
  # The puzzle area before an animal is picked.
  pick: Pick an animal
  pickDetail: Solve a puzzle and {name} feels all better!
  byeDetail: Say bye and go exploring.
  listKeys: ↑ ↓ choose · Enter pick · Esc bye
  # Under a doctor's puzzle while another animal needs help too.
  puzzleKeys: ↑ ↓ help another animal · Esc bye
  # The puzzle area when nobody needs the doctor.
  allFit: Time to explore!
  allFitKeys: Enter or Esc to say bye

keys:
  # A key cap, as printed on the keyboard.
  esc: Esc

hud:
  # The tag on the card of the lead: the animal that steps into the next battle.
  goesFirst: goes first
  # Under the party cards, after the number keys 1–n.
  pickLead: Pick who goes first
  # Under the party cards, after the Esc key cap.
  menu: Menu

pause:
  # The pause menu's title.
  title: Paused
  # Above the list of the party's animals.
  team: Your team
  # The row that closes the menu.
  resume: Keep playing
  # The row that leaves the game for the title screen (the game is saved; Continue picks it up).
  quit: Start screen
  # The picked animal's options: become the lead, move one place, get a nickname.
  goFirst: Go first
  moveUp: Move up
  moveDown: Move down
  newName: New name
  back: Back
  # The right-hand panel before an animal is picked.
  pick: Pick an animal
  pickHelp: Choose who goes first, move it, or give it a name.
  # Under the options of a tired animal, whose "Go first" is greyed.
  tiredHelp: "{name} is tired, so it can't go first."
  # Above the name box.
  nameTitle: New name for {name}
  # Under the name box; {max} is the most characters a name can have.
  nameRule: Letters and numbers, up to {max}.
  # Under the name box, when the typed name will be stored differently.
  willBe: Its name will be {name}.
  # The key reminder at the bottom, one per screen of the menu.
  keysList: ↑ ↓ choose · Enter pick · Esc close
  keysOptions: ↑ ↓ choose · Enter do it · Esc back
  keysNaming: Enter save · Esc back

save:
  # On the message line when a saved game is picked up.
  welcomeBack: Welcome back!
  # The saved game could not be read. It is kept aside; this is a new game.
  couldNotLoad: Your saved game didn't load, so here is a new one.
  # The saved game was written by a newer version of the game than this page.
  newerGame: Your game was saved by a newer Animath. Reload the page to play it!
  # The browser will not let the page store anything, so nothing is saved.
  cannotSave: This browser can't keep your game, so it starts new every time.

title:
  # The game's name, big, at the top of the title screen.
  name: Animath
  # The menu's rows.
  continue: Continue
  newGame: New game
  language: Language
  # Beside Continue, after the name of the saved team's first animal: how big the team is.
  animals:
    one: '{count} animal'
    other: '{count} animals'
  # The key reminder under the menu; on a setting's row, how to change it.
  keys: ↑ ↓ choose · Enter pick
  keysSetting: ↑ ↓ choose · ← → change
  # Asked before a new game puts the saved one away. {name}: the saved team's first animal.
  confirm:
    title: Start a new game?
    away: Your game with {name} is put away safely.
    fresh: You start again with a new animal.
    back: No, go back
    yes: Yes, new game
    keys: ↑ ↓ choose · Enter pick · Esc back
  # The starters side by side.
  starter:
    title: Pick your first animal!
    # Under the lit one. {animal}: its species; {kinds}: every kind of sum its attacks ask, as a list.
    loves: '{animal.name} loves {kinds}!'
    keys: ← → choose · Enter pick · Esc back
  # The name box for the animal just picked. {animal}: its species.
  naming:
    title: What will you call your {animal.name}?
    empty: Leave it empty and it is just called {animal.name}.
    keys: Enter done · Esc back
