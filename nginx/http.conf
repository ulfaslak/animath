# The http-level settings both configs share: the server's
# (nginx.conf.template) and the local stack's (local/nginx.conf.template).

include /etc/nginx/mime.types;
default_type application/octet-stream;
server_tokens off;

# Docker's own DNS, asked again every 5 seconds. With the app's address in a
# variable (app.conf), nginx looks `app` up while it serves rather than once at
# start: a container a deploy replaces is found without a reload, and while
# scripts/deploy.sh runs a canary under the same name, requests go to both.
resolver 127.0.0.11 valid=5s ipv6=off;

# No client addresses in the access log: the players are kids, and a request's
# time, path, status and duration are what a problem needs. The image sends
# the log to the container's stdout, capped in docker-compose.prod.yml.
#
# Nor a welcome link's token: it logs a kid in to their account once, and a log
# is read into transcripts. The link the admin prints carries it after `#`,
# which no request does, and the page sends it in a header or a body; this is
# for a link typed as `/?welcome=<token>`. The error log cannot be cleaned (it
# writes a failed request's line whole), which is why the token stays out of
# every request line. The app's own log hides it the same way
# (packages/server/src/app.ts, hideWelcomeTokens).
map $request $request_logged {
    "~*^(?<head>.*?welcome[=/])[^ &#/?]+(?<tail>.*)$" "${head}[hidden]${tail}";
    default $request;
}
log_format game '[$time_local] "$request_logged" $status $body_bytes_sent $request_time';
access_log /var/log/nginx/access.log game;

# Above the app's own 1 MiB limit on a save (SAVE_MAX_BYTES), so the app, not
# nginx, refuses an oversized one, with the JSON 413 the client reads.
client_max_body_size 2m;

gzip on;
gzip_vary on;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

# WebSockets: an upgrade passes its Upgrade header on; anything else closes its
# connection to the app, as nginx does by default.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# POSTs: a guard against floods, per address, never the limit a kid meets. The
# POSTs are the account routes (logging in and signing up), which keep their
# own limits with words for the kid (packages/server/src/rate-limit.ts: 60
# logins per address in 15 minutes); this one lets 60 through at once and then
# one a second, so a whole class signing in together behind one school address
# never reaches it, and only a flood does.
#
# Keyed on the method alone, never on a path: nginx and the app read a path
# differently (to the app, `/api\players` is `/api/players`), so a limit on
# one path would limit one spelling of it. And per address only because the
# domain has no AAAA record: behind Docker's port proxy every IPv6 visitor
# would reach nginx from one address.
map $request_method $post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $post_key zone=posts:1m rate=60r/m;
