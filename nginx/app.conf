# How the game is served: the server-level part both configs share, included
# in nginx.conf.template's HTTPS server and local/nginx.conf.template's HTTP one.
#
# add_header and limit_req are declared here, at server level, and in no
# location. nginx hands them down only to a level that declares none of its
# own, so one add_header in a location would drop every header below there.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;

limit_req zone=new_players burst=20 nodelay;
limit_req_status 429;

# While the app does not answer (a deploy's few seconds, or the server down):
# a page that says so in the kid's language and reloads itself.
error_page 502 504 /502.html;

location = /502.html {
    root /etc/nginx/mathgame;
    internal;
}

# The API, and the WebSocket at /api/ws: an Upgrade is passed on. A quiet
# socket would be closed after nginx's default 60 seconds without data; here
# it lasts an hour, and the server pings each socket well within that.
location /api/ {
    set $app http://app:3000;
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# The files Vite built, each named after its content hash. For a few seconds
# of a deploy the old app and the new one answer side by side, and a page from
# one build asks for files only that build has. The app answers a file it does
# not have with a 404, and nginx then asks the other one.
location /immutable/ {
    set $app http://app:3000;
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_next_upstream error timeout http_404;
}

# The game's page, and every other file of the client.
location / {
    set $app http://app:3000;
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
