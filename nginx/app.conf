# How the game is served: the server-level part both configs share, included
# in nginx.conf.template's HTTPS server and local/nginx.conf.template's HTTP one.
#
# add_header and limit_req are declared here, at server level, and in no
# location. nginx hands them down only to a level that declares none of its
# own, so one add_header in a location would drop every header below there.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;

# What a page of the game may load and run: its own files from its own
# address, nothing from another host. Report-only for now: a browser refuses
# nothing and tells the page what it would have refused, which the page sends
# home as an error report (`violationOf` in the client's error-reports.ts;
# `admin errors` lists them). The flip to enforcing waits in AGENTS/DEFERRED.md.
# Safari's console says a report-only policy with no `report-to` "will have no
# effect"; it still tells the page (WebKit 26.6, 2026-11-21), so none is set.
# - script-src: each inline script by its hash, index.html's and 502.html's
#   (security-policy.test.ts recomputes them), and `unsafe-eval` because the
#   check for a browser too old asks `new Function` whether it reads the
#   game's newest syntax (index.html, boot-failure.ts); without it every
#   browser would be told it is too old.
# - style-src: the cards in index.html and Svelte set inline styles.
# - img-src: a portrait is a `data:` image the page draws (portraits.ts).
# - connect-src: the API and the presence socket, at the address the page
#   came from (`$http_host` holds the port, as a local stack needs).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-vT1l1b4Vkk09f3vi6QrzEPnQBx6K5u2Ra1mhTmi5Z34=' 'sha256-ulzaNJ4BWIaR18O48a5fVmdJiVw4jo7zSLDt+j9QQ0M=' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://$http_host ws://$http_host; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

limit_req zone=posts burst=60 nodelay;
limit_req_status 429;

# How long nginx waits for the app to take a connection, before it tries the
# app's other address, if it has one. On Docker's network a container that is
# there answers within a millisecond, and refuses at once when nothing listens.
# An address whose container has left (a deploy's canary, or the app between
# its old container and its new one) answers nothing at all, and the default,
# 60 s, would hold the request that long. A request that was never sent goes
# on to the other address, a POST too (proxy_next_upstream's default, `error
# timeout`). Every location below takes it from here.
proxy_connect_timeout 250ms;

# While the app does not answer (a deploy's few seconds, or the server down):
# a page that says so in the kid's language and reloads itself.
error_page 502 504 /502.html;

location = /502.html {
    root /etc/nginx/mathgame;
    internal;
}

# The API, and the WebSocket at /api/ws: an Upgrade is passed on. A quiet
# socket would be closed after nginx's default 60 seconds without data; here
# it lasts an hour, and the server pings each socket well within that.
# Every location blanks X-Forwarded-Host: the app reads it as a host the
# browser may have addressed (`requestHosts` in request.ts), and nginx names
# that host in Host, so one a client sends is never passed on.
location /api/ {
    set $app http://app:3000;
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# The client's files: the ones Vite built (/immutable/, each named after its
# content hash) and the ones public/ copies over (/assets/). For a few seconds
# of a deploy the old app and the new one answer side by side, and a page from
# one build asks for files only that build has. The app answers a file it does
# not have with a 404, and nginx then asks the other one.
location ~ ^/(immutable|assets)/ {
    set $app http://app:3000;
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host "";
    proxy_next_upstream error timeout http_404;
}

# The game's page, and every other file of the client.
location / {
    set $app http://app:3000;
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
